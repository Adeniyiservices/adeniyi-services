<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Adeniyi Services</le>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#f5f7fb;
    color:#172033;
}

header{
    background:#0b1f3a;
    color:white;
    padding:18px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:25px;
    font-weight:bold;
}

.logo span{
    color:#f5b942;
}

.menu{
    font-size:26px;
}

.hero{
    background:linear-gradient(135deg,#0b1f3a,#17618f);
    color:white;
    padding:55px 20px;
    text-align:center;
}

.hero h1{
    font-size:34px;
    line-height:1.15;
    margin-bottom:15px;
}

.hero p{
    font-size:17px;
    margin-bottom:28px;
    color:#e4edf5;
}

.search{
    max-width:650px;
    margin:auto;
    background:white;
    padding:7px;
    border-radius:14px;
    display:flex;
    box-shadow:0 8px 25px rgba(0,0,0,.2);
}

.search input{
    width:100%;
    border:0;
    outline:0;
    padding:14px;
    font-size:15px;
}

.search button{
    border:0;
    background:#f5b942;
    padding:0 18px;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
}

.location{
    max-width:650px;
    margin:12px auto 0;
}

.location select{
    width:100%;
    padding:14px;
    border:0;
    border-radius:10px;
    font-size:15px;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:35px 20px;
}

.title{
    text-align:center;
    margin-bottom:25px;
}

.title h2{
    font-size:27px;
    margin-bottom:8px;
}

.title p{
    color:#667085;
}

.categories{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.category{
    background:white;
    padding:25px 10px;
    text-align:center;
    border-radius:16px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
    cursor:pointer;
    transition:.2s;
}

.category:hover{
    transform:translateY(-4px);
}

.icon{
    font-size:35px;
    margin-bottom:10px;
}

.category h3{
    font-size:16px;
}

.popular{
    margin-top:40px;
}

.cards{
    display:grid;
    grid-template-columns:1fr;
    gap:18px;
}

.card{
    background:white;
    border-radius:16px;
    padding:20px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.card h3{
    margin-bottom:8px;
}

.card p{
    color:#667085;
    margin-bottom:15px;
}

.contact{
    display:inline-block;
    background:#0b1f3a;
    color:white;
    padding:11px 18px;
    border-radius:9px;
    text-decoration:none;
}

.whatsapp{
    background:#25D366;
}

.call{
    background:#0b1f3a;
}

.annonce{
    margin-top:40px;
    background:linear-gradient(135deg,#f5b942,#ffd978);
    padding:30px 20px;
    border-radius:18px;
    text-align:center;
}

.annonce h2{
    margin-bottom:10px;
}

.annonce p{
    margin-bottom:20px;
}

.annonce button{
    background:#0b1f3a;
    color:white;
    border:0;
    padding:14px 22px;
    border-radius:10px;
    font-weight:bold;
}

.contact-section{
    text-align:center;
    padding:10px 20px 40px;
}

.contact-buttons{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
}

footer{
    background:#0b1f3a;
    color:white;
    text-align:center;
    padding:35px 20px;
    margin-top:20px;
}

footer p{
    color:#cbd5e1;
    margin-top:10px;
}

/* BOUTON WHATSAPP FLOTTANT */

.whatsapp-float{
    position:fixed;
    right:18px;
    bottom:18px;
    width:58px;
    height:58px;
    background:#25D366;
    color:white;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    font-size:30px;
    box-shadow:0 5px 18px rgba(0,0,0,.25);
    z-index:999;
}

.whatsapp-float:hover{
    transform:scale(1.08);
}

@media(min-width:700px){

    .categories{
        grid-template-columns:repeat(4,1fr);
    }

    .cards{
        grid-template-columns:repeat(3,1fr);
    }

    .hero h1{
        font-size:48px;
    }
}

</style>
</head>

<body>

<header>

    <div class="logo">
        Adeniyi <span>Services</span>
    </div>

    <div class="menu">☰</div>

</header>


<section class="hero">

    <h1>Trouvez le service<br>dont vous avez besoin</h1>

    <p>
        Trouvez. Comparez. Contactez.
    </p>

    <div class="search">

        <input
        id="searchInput"
        type="text"
        placeholder="Ex : coiffeuse, emploi, appartement..."
        >

        <button onclick="rechercher()">
            🔎
        </button>

    </div>

    <div class="location">

        <select id="ville">

            <option value="">
                📍 Choisissez votre ville
            </option>

            <option>Cotonou</option>
            <option>Abomey-Calavi</option>
            <option>Porto-Novo</option>
            <option>Ouidah</option>
            <option>Parakou</option>
            <option>Abomey</option>

        </select>

    </div>

</section>


<section class="container">

    <div class="title">

        <h2>Que recherchez-vous ?</h2>

        <p>
            Découvrez nos principales catégories
        </p>

    </div>


    <div class="categories">

        <div class="category" onclick="categorie('Emploi')">
            <div class="icon">💼</div>
            <h3>Emploi</h3>
        </div>

        <div class="category" onclick="categorie('Immobilier')">
            <div class="icon">🏠</div>
            <h3>Immobilier</h3>
        </div>

        <div class="category" onclick="categorie('Commerce')">
            <div class="icon">🛍️</div>
            <h3>Commerce</h3>
        </div>

        <div class="category" onclick="categorie('Beauté')">
            <div class="icon">💇🏽</div>
            <h3>Beauté</h3>
        </div>

        <div class="category" onclick="categorie('Transport')">
            <div class="icon">🚗</div>
            <h3>Transport</h3>
        </div>

        <div class="category" onclick="categorie('Éducation')">
            <div class="icon">🎓</div>
            <h3>Éducation</h3>
        </div>

        <div class="category" onclick="categorie('Santé')">
            <div class="icon">🏥</div>
            <h3>Santé</h3>
        </div>

        <div class="category" onclick="categorie('Services')">
            <div class="icon">🔧</div>
            <h3>Services</h3>
        </div>

    </div>


    <div class="popular">

        <div class="title">

            <h2>⭐ Services populaires</h2>

            <p>
                Découvrez quelques services disponibles
            </p>

        </div>


        <div class="cards">

            <div class="card">

                <h3>💇🏽 Salon de beauté</h3>

                <p>
                    Coiffure, esthétique et soins de beauté.
                </p>

                <a href="#" class="contact">
                    Voir le service
                </a>

            </div>


            <div class="card">

                <h3>🏠 Immobilier</h3>

                <p>
                    Maisons, chambres et appartements disponibles.
                </p>

                <a href="#" class="contact">
                    Voir les annonces
                </a>

            </div>


            <div class="card">

                <h3>💼 Emploi</h3>

                <p>
                    Découvrez les opportunités professionnelles.
                </p>

                <a href="#" class="contact">
                    Voir les offres
                </a>

            </div>

        </div>

    </div>


    <div class="annonce">

        <h2>Vous proposez un service ?</h2>

        <p>
            Faites connaître votre activité à de nouveaux clients.
        </p>

        <button onclick="publier()">
            ➕ Publier mon annonce
        </button>

    </div>

</section>


<!-- CONTACT -->

<section class="contact-section">

    <div class="title">

        <h2>📞 Contactez-nous</h2>

        <p>
            Une question ? Contactez Adeniyi Services.
        </p>

    </div>

    <div class="contact-buttons">

        <a
        href="https://wa.me/22991476323"
        target="_blank"
        class="contact whatsapp">
            💬 WhatsApp
        </a>

        <a
        href="tel:+22991476323"
        class="contact call">
            📞 Appeler
        </a>

    </div>

</section>


<footer>

    <div class="logo">
        Adeniyi <span>Services</span>
    </div>

    <p>
        Trouvez. Comparez. Contactez.
    </p>

    <p>
        📞 +229 91 47 63 23
    </p>

    <p>
        © 2026 Adeniyi Services
    </p>

</footer>


<!-- WHATSAPP FLOTTANT -->

<a
href="https://wa.me/22991476323"
target="_blank"
class="whatsapp-float"
aria-label="Contacter Adeniyi Services sur WhatsApp">
    💬
</a>


<script>

function rechercher(){

    let recherche =
    document.getElementById("searchInput").value;

    let ville =
    document.getElementById("ville").value;

    if(recherche.trim()===""){

        alert("Veuillez entrer ce que vous recherchez.");

        return;
    }

    alert(
        "Recherche : " + recherche +
        "\nVille : " +
        (ville || "Toutes les villes") +
        "\n\nLes résultats seront bientôt disponibles."
    );
}


function categorie(nom){

    alert(
        "Catégorie : " + nom +
        "\n\nCette catégorie sera bientôt disponible."
    );

}


function publier(){

    alert(
        "La publication d'annonces sera bientôt disponible."
    );

}

</script>

</body>
</html>
